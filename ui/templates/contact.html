{% extends "base.html" %}

{% block title %}聯絡 - 我的網站{% endblock %}

{% block content %}
<h1>聯絡我們</h1>

{% if success %}
<div style="background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem;">
    ✓ 感謝您的提交！我們會盡快回覆。
</div>
{% endif %}

<form method="POST" style="max-width: 600px; margin-top: 2rem;">
    <div style="margin-bottom: 1.5rem;">
        <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">名稱</label>
        <input type="text" id="name" name="name" required 
               style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem;">
    </div>

    <div style="margin-bottom: 1.5rem;">
        <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">電子郵件</label>
        <input type="email" id="email" name="email" required 
               style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem;">
    </div>

    <div style="margin-bottom: 1.5rem;">
        <label for="message" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">訊息</label>
        <textarea id="message" name="message" rows="5" required 
                  style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; font-family: inherit;"></textarea>
    </div>

    <button type="submit" 
            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 0.75rem 2rem; border-radius: 4px; font-size: 1rem; cursor: pointer; transition: transform 0.2s;">
        發送訊息
    </button>
</form>
{% endblock %}
